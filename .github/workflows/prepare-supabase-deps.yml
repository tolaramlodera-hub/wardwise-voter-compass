name: Prepare Supabase dependencies

on:
  push:
    branches:
      - feature/supabase-secure-foundation
    paths:
      - package.json
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile-and-build:
    if: "!contains(github.event.head_commit.message, '[skip lockfile]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/supabase-secure-foundation
      - uses: oven-sh/setup-bun@v2
      - name: Resolve and update Bun lockfile
        run: bun install
      - name: Commit lockfile if changed
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: update Bun lockfile [skip lockfile]"
            git push
          fi
      - name: Verify frozen install
        run: bun install --frozen-lockfile
      - name: Run production build
        run: bun run build
